<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pathlight · Pathfinding Visualizer</title>
  <meta name="description" content="Watch BFS, DFS, Dijkstra, A* and Greedy search find their way through a maze.">
  <link rel="icon" href="assets/logo.svg">
  <style>
    :root { --bg:#0b1020; --panel:#131a2e; --line:#243049; --text:#e8edf7; --muted:#93a1bb; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--text); background: radial-gradient(1100px 480px at 75% -10%, #1b2a52 0, transparent 60%), var(--bg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
    header { display:flex; align-items:center; gap:14px; }
    header img { width:48px; height:48px; }
    h1 { margin:0; font-size:1.7rem; letter-spacing:-.02em; }
    h1 span { background:linear-gradient(90deg,#34d399,#60a5fa); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .sub { margin:0; color:var(--muted); font-size:.95rem; }
    .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--line);
           border-radius:14px; padding:10px 12px; margin:16px 0 8px; }
    select, button { font:inherit; color:var(--text); background:#0e1527; border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer; }
    select:hover, button:hover { border-color:#3b82f6; }
    button.primary { background:linear-gradient(90deg,#10b981,#3b82f6); border:0; font-weight:700; color:#04121a; }
    label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.85rem; }
    #info { margin:0 0 12px; color:var(--muted); font-size:.92rem; min-height:1.4em; }
    canvas { display:block; width:100%; height:auto; border-radius:14px; border:1px solid var(--line); touch-action:none; cursor:crosshair; }
    .stats { display:flex; flex-wrap:wrap; gap:20px; margin-top:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .stats b { color:var(--text); }
    .legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; font-size:.85rem; color:var(--muted); }
    .legend i { display:inline-block; width:14px; height:14px; border-radius:4px; margin-right:6px; vertical-align:-2px; }
    footer { margin-top:24px; color:var(--muted); font-size:.85rem; }
    footer a { color:#60a5fa; }
  </style>
</head>
<body>
<main>
  <header>
    <img src="assets/logo.svg" alt="">
    <div>
      <h1>path<span>light</span></h1>
      <p class="sub">Watch pathfinding algorithms think, one cell at a time.</p>
    </div>
  </header>

  <div class="bar">
    <select id="algo" aria-label="Algorithm"></select>
    <select id="tool" aria-label="Draw tool">
      <option value="wall">Draw: Walls</option>
      <option value="mud">Draw: Mud (cost 5)</option>
    </select>
    <button id="run" class="primary">▶ Run</button>
    <button id="clearPath">Clear path</button>
    <button id="random">🎲 Random</button>
    <button id="clearBoard">Clear board</button>
    <label>Speed <input id="speed" type="range" min="1" max="60" value="8"></label>
  </div>
  <p id="info"></p>

  <canvas id="board" aria-label="Pathfinding grid"></canvas>

  <div class="stats">
    <span>Status: <b id="status">Ready</b></span>
    <span>Cells visited: <b id="visited">0</b></span>
    <span>Path length: <b id="length">–</b></span>
    <span>Path cost: <b id="cost">–</b></span>
  </div>
  <div class="legend">
    <span><i style="background:#22c55e"></i>Start (drag me)</span>
    <span><i style="background:#ef4444"></i>Goal (drag me)</span>
    <span><i style="background:#94a3b8"></i>Wall</span>
    <span><i style="background:#92400e"></i>Mud</span>
    <span><i style="background:#22d3ee"></i>Frontier</span>
    <span><i style="background:#6d28d9"></i>Visited</span>
    <span><i style="background:#fde047"></i>Path</span>
  </div>
  <footer>Click or drag on the grid to draw. Click a wall again to erase it. · <a href="https://github.com/YOUR_USERNAME/pathlight">Source on GitHub</a></footer>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
